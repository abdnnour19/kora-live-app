<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>كورة لايف الجزائر | مباريات اليوم بث مباشر - Kora Live DZ</title>
    <meta name="description" content="شاهد مباريات اليوم بث مباشر بدون تقطيع. تطبيق كورة لايف الجزائر لمتابعة الدوريات العالمية بجودة عالية.">
    <link rel="canonical" href="https://kora-live-dz.js.org/" />
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-database.js"></script>

    <style>
        /* التنسيقات الأصلية الخاصة بك */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Cairo', sans-serif; background-color: #f1f2f6; padding: 10px; padding-bottom: 70px; user-select: none; }
        .app-container { max-width: 450px; margin: 0 auto; min-height: 80vh; }
        
        .header { 
            background: linear-gradient(135deg, #581c0c, #802c12); 
            color: white; padding: 15px; border-radius: 15px; text-align: center; 
            margin-bottom: 20px; box-shadow: 0 4px 15px rgba(88, 28, 12, 0.3); 
            position: relative;
        }

        .live-count-badge { background: rgba(0, 0, 0, 0.3); display: inline-flex; align-items: center; padding: 5px 15px; border-radius: 50px; margin-top: 5px; font-size: 0.9rem; }
        .live-eye { color: #e74c3c; margin-inline-end: 8px; animation: blink 2s infinite; }

        .match-card { background: white; border-radius: 15px; overflow: hidden; margin-bottom: 15px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.08); transition: transform 0.2s; }
        .match-card:active { transform: scale(0.98); }

        .card-body { display: flex; align-items: center; justify-content: space-between; padding: 15px; }
        .team { display: flex; flex-direction: column; align-items: center; width: 30%; text-align: center; }
        .team img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
        .match-info { text-align: center; width: 40%; }
        
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; color: white; font-weight: bold; }
        .bg-live { background-color: #e74c3c; animation: pulse 1.5s infinite; }
        .bg-soon { background-color: #2c3e50; }
        
        .card-footer { background: #f8f9fa; padding: 10px; display: flex; flex-wrap: wrap; justify-content: space-between; font-size: 0.75rem; color: #555; border-top: 1px solid #eee; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; display: none; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-box { background: #2d3436; width: 90%; max-width: 350px; padding: 25px; border-radius: 25px; text-align: center; color: white; position: relative; }
        .video-box { background: #000; width: 100%; max-width: 800px; border-radius: 10px; overflow: hidden; position: relative; }
        
        video { width: 100%; height: auto; display: block; }
        .close-video-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); color: white; border: none; border-radius: 50%; width: 35px; height: 35px; cursor: pointer; z-index: 101; }

        .player-btn { display: flex; width: 100%; padding: 15px; margin: 12px 0; border-radius: 15px; text-decoration: none; color: white; font-weight: bold; align-items: center; justify-content: center; gap: 10px; border: none; }
        .btn-vlc { background: linear-gradient(45deg, #e67e22, #d35400); }
        .btn-mx { background: linear-gradient(45deg, #3498db, #2980b9); }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h2 id="app-title">🔥 كورة لايف الجزائر</h2>
        <div class="live-count-badge">
            <i class="fa-solid fa-eye live-eye"></i>
            <span id="live-text">يشاهد الآن:</span>
            <span id="online-count" style="margin-right:5px; font-weight:bold;">1</span>
        </div>
    </div>

    <div id="matches-list">
        </div>
</div>

<div id="playerModal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-box">
        <h3 style="margin-bottom:15px;">اختر المشغل</h3>
        <a id="vlc-link" href="#" class="player-btn btn-vlc"><i class="fa-brands fa-vlc"></i> فتح في VLC</a>
        <a id="mx-link" href="#" class="player-btn btn-mx"><i class="fa-solid fa-play"></i> فتح في MX Player</a>
        <button onclick="document.getElementById('playerModal').style.display='none'" class="player-btn" style="background:#444;">إغلاق</button>
    </div>
</div>

<div id="internalPlayerModal" class="modal-overlay">
    <div class="video-box">
        <button class="close-video-btn" onclick="closeInternalPlayer()"><i class="fa-solid fa-xmark"></i></button>
        <video id="hls-video" controls playsinline crossorigin="anonymous"></video>
    </div>
</div>

<div id="facebookPlayerModal" class="modal-overlay">
    <div class="video-box" style="background:#fff;">
        <button class="close-video-btn" onclick="closeFacebookPlayer()"><i class="fa-solid fa-xmark"></i></button>
        <div id="fb-iframe-container" style="width:100%; height:300px; background:#000;"></div>
    </div>
</div>

<script>
    // إعدادات Firebase الخاصة بك
    const firebaseConfig = {
      apiKey: "AIzaSyD0te1Adv8xLqFaUZnT2QHvYWu5eFqDRHA",
      authDomain: "abgfd-c89c5.firebaseapp.com",
      databaseURL: "https://abgfd-c89c5-default-rtdb.firebaseio.com",
      projectId: "abgfd-c89c5",
      storageBucket: "abgfd-c89c5.firebasestorage.app",
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // عداد المشاهدين المباشر
    const onlineRef = database.ref('onlineUsers');
    database.ref('.info/connected').on('value', s => { if(s.val()) { const c = onlineRef.push(); c.onDisconnect().remove(); c.set(true); } });
    onlineRef.on('value', s => { document.getElementById('online-count').innerText = s.numChildren(); });

    // تحميل المباريات من TodayMatches
    function loadMatches() {
        const list = document.getElementById('matches-list');
        database.ref('TodayMatches').on('value', (snap) => {
            list.innerHTML = '';
            const data = snap.val();
            if(!data) {
                list.innerHTML = '<p style="text-align:center; color:#666;">لا توجد مباريات مجدولة حالياً</p>';
                return;
            }
            Object.values(data).reverse().forEach(match => {
                const isLive = true; 
                list.innerHTML += `
                    <div class="match-card" onclick="openPlayerOptions('${match.streamLink}')">
                        <div class="card-body">
                            <div class="team"><img src="${match.logo1}"><b>${match.team1}</b></div>
                            <div class="match-info">
                                <span style="display:block; font-weight:bold; font-size:1.1rem;">${match.time}</span>
                                <span class="status-badge ${isLive ? 'bg-live' : 'bg-soon'}">${isLive ? 'مباشر' : 'قريباً'}</span>
                            </div>
                            <div class="team"><img src="${match.logo2}"><b>${match.team2}</b></div>
                        </div>
                        <div class="card-footer">
                            <span><i class="fa-solid fa-tv"></i> ${match.channel}</span>
                            <span><i class="fa-solid fa-microphone"></i> ${match.commentator || 'غير محدد'}</span>
                        </div>
                    </div>`;
            });
        });
    }

    let hlsInstance = null;

    function openPlayerOptions(url) {
        if (!url) return;
        const link = url.trim();

        if (link.includes('facebook.com') || link.includes('fb.watch')) {
            openFacebookPlayer(link);
        } 
        else if (link.startsWith('https') && (link.includes('.m3u8') || link.includes('.mpd'))) {
            openInternalPlayer(link);
        } 
        else {
            document.getElementById('vlc-link').href = `vlc://${link}`;
            document.getElementById('mx-link').href = `intent:${link}#Intent;package=com.mxtech.videoplayer.ad;type=video/*;end`;
            document.getElementById('playerModal').style.display = 'flex';
        }
    }

    function openInternalPlayer(url) {
        const modal = document.getElementById('internalPlayerModal');
        const video = document.getElementById('hls-video');
        modal.style.display = 'flex';

        if (Hls.isSupported()) {
            if (hlsInstance) hlsInstance.destroy();
            hlsInstance = new Hls();
            hlsInstance.loadSource(url);
            hlsInstance.attachMedia(video);
            hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.play();
        }
    }

    function closeInternalPlayer() {
        const video = document.getElementById('hls-video');
        video.pause();
        if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
        document.getElementById('internalPlayerModal').style.display = 'none';
    }

    function openFacebookPlayer(url) {
        const modal = document.getElementById('facebookPlayerModal');
        const container = document.getElementById('fb-iframe-container');
        const embedUrl = `https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(url)}&show_text=0`;
        
        container.innerHTML = `<iframe src="${embedUrl}" width="100%" height="100%" style="border:none;overflow:hidden" scrolling="no" frameborder="0" allowfullscreen="true" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe>`;
        modal.style.display = 'flex';
    }

    function closeFacebookPlayer() {
        document.getElementById('fb-iframe-container').innerHTML = '';
        document.getElementById('facebookPlayerModal').style.display = 'none';
    }

    function closeModal(e) { if (e.target.classList.contains('modal-overlay')) e.target.style.display = 'none'; }

    // تشغيل جلب البيانات
    loadMatches();
</script>
</body>
</html>
